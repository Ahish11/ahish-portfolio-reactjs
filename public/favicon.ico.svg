<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="64" fill="#080E18"/>
  <path d="M160 180L100 256L160 332" stroke="#00D1FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </path>
  <path d="M352 180L412 256L352 332" stroke="#00D1FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 120L232 392" stroke="#00D1FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Simplified Glow Effect for SVG -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M160 180L100 256L160 332" stroke="#00D1FF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 180L412 256L352 332" stroke="#00D1FF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M280 120L232 392" stroke="#00D1FF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>